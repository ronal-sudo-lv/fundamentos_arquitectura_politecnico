name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"    # igualar con el del Dockerfile

jobs:
  plantilla:
    name: plantilla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plantilla-servicio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: plantilla-servicio/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  servicios:
    name: ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        servicio: [pagos-service, pedidos-service]
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.servicio }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  contratos:
    name: contratos (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias para validación
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pytest pydantic-settings sqlalchemy asyncpg aiosqlite
      - run: python herramientas/validar_entrega.py --todos
        continue-on-error: true
